<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="utf-8">
</head>
<body>
<main>
    <section class="accent-block" data-bs-theme="blueprint-light">
        <div class="min-h-50vh block-pt-lg block-pb-lg">
            <div class="container text-center">
                <div class="max-w-75ch mx-auto">
                    <picture class="bg-theme d-inline-block mask-size-contain mb-6"
                             style="mask: url('https://www.vektis.nl/build/assets/404-DkRuAN4a.svg')"
                    >
                        <img src="https://www.vektis.nl/build/assets/404-DkRuAN4a.svg" class="opacity-0" alt="404">
                    </picture>
                    <h1 class="h3">
                        De pagina die je zoekt is niet gevonden
                    </h1>
                    <div class="content-wrapper mb-4">
                        <p>
                            Sorry, de pagina die je zoekt is niet gevonden.<br>Zoek hieronder naar de juiste pagina of ga terug naar de <a href="/">Homepage</a>
                        </p>
                    </div>
                    <form action="/zoeken" class="max-w-50ch mx-auto text-start">
                        <search class="input-group"><input class="form-control js-searchbar-input" name="q" placeholder="Waar ben je naar op zoek?" required="required" type="search" enterkeyhint="search" ><button class="btn btn-primary-subtle " data-loading-class="is-loading" aria-label="Zoeken" ></button></search>
                    </form>
                </div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
